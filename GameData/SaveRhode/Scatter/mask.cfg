@Kopernicus:AFTER[ParallaxStock]
{
    @Body[Kerbin]
    {
        %PQS
        {
            %Mods
            {
                !MapDecalVertexRemoveScatter:HAS[#name[ParallaxMaskKSC]]    // Remove the existing parallax mask for the vanilla KSC, if needed
				MapDecalVertexRemoveScatter
				{
					name = ParallaxMaskKSC
					BlockedScatters		// The scatters you want to mask using this decal
					{
						name = OakTree
						name = PineTree
						name = KerbinShrub
						name = Roses
						name = HugeCactus
						name = LargeCactus
						name = MedCactus
						name = SmallCactus
						name = TinyCactus
						name = LargeCactiCluster
						name = MedCactiCluster
						name = SmallCactiCluster
						name = BaobabTreeTrunk
					}
					Position		// Latitude and longitude of the decal centre - I use the exact centre of the VAB
					{
						// Exact center of the top of the KSC VAB between the two helipads
						latitude = -0.000393499095840886
						longitude = -48.2194254526201
					}
					debugShowDecal = false		// Enable this to show the decal debug colours
					colorMap = SaveRhode/Scatter/scatterMask.dds		// The mask to use
					debugColorMap = SaveRhode/Scatter/scatterMask.dds	// Set this if debugShowDecal is enabled, otherwise just remove it
					angle = 30		// The rotation of the decal - angle 15 aligns exactly with the vanilla runway facing direction (out to sea, 90 deg)
					radius = 2000	// Size of the decal
					order = 99999	// Order in which to apply the decal
				}
            }
        }
    }
}