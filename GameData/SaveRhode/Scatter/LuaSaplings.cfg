// =====================================================================
//  SaveRhode — Lua 树苗散点（LuaSapling）
//
//  设定依据（BeyondHome 本地化文本）：
//    "Due to terraforming, saplings have been able to grow on Lua. They are
//     common in lowlands, but they are endangered because of the halted
//     progress with the terraforming."
//  因此：幼树形态、细高分枝、树冠稀疏；只生成在低地、密度低、
//  避开陡坡；与 Lua 稀薄大气下的弱光环境匹配（深青绿、灰白树皮）。
//
//  模型：SaveRhode/Models/LuaSapling/*.obj（LOD0/1/2 + 冠层）
//        需用 Unity + PartTools 导出为同名 .mu 后才会被 Parallax 加载，
//        导出步骤见同目录 UNITY_EXPORT.md。
//  贴图：SaveRhode/Textures/LuaSapling/*.dds（DXT5 + 完整 mipmap）
//
//  重新生成模型与贴图：
//      python tools/make_lua_sapling.py
// =====================================================================

ParallaxScatters
{
    Body
    {
        name = Lua
        configVersion = 2

        // -----------------------------------------------------------------
        //  树干 / 枝条
        // -----------------------------------------------------------------
        Scatter
        {
            name = LuaSapling
            model = SaveRhode/Models/LuaSapling/saplingTrunkLOD0
            collisionLevel = 2

            Optimizations
            {
                frustumCullingStartRange = 40
                frustumCullingScreenMargin = -400
                maxRenderableObjectsLOD0 = 400
                maxRenderableObjectsLOD1 = 2000
                maxRenderableObjectsLOD2 = 20000
            }

            SubdivisionSettings
            {
                subdivisionRangeMode = noSubdivision
            }

            DistributionNoise
            {
                noiseType = simplexPerlin
                inverted = True
                frequency = 92
                octaves = 5
                lacunarity = 2
                seed = 412
            }

            Material
            {
                shader = Custom/ParallaxInstancedSolid
                _MainTex = SaveRhode/Textures/LuaSapling/saplingBark.dds
                _BumpMap = SaveRhode/Textures/LuaSapling/saplingBarknrm.dds
                _WindMap = Parallax_StockScatterTextures/PluginData/grassuv2.dds
                _SpecularPower = 12
                _SpecularIntensity = 0.02
                _FresnelPower = 3
                _EnvironmentMapFactor = 1
                _BumpScale = 1.2
                _Hapke = 1
                _WindScale = 0.004
                _WindHeightStart = 0.45
                _WindHeightFactor = 1.4
                _WindSpeed = 0.85
                _WindIntensity = 0.015
                _FresnelColor = 0.05,0.05,0.05,1
                _Color = 1,1,1,1
                _CullMode = 2
                Keywords
                {
                    name = WIND
                }
            }

            Distribution
            {
                seed = 431.7
                spawnChance = 0.032
                range = 3200
                populationMultiplier = 1
                minScale = 0.85,0.85,0.85
                maxScale = 1.35,1.35,1.35
                scaleRandomness = 0.25
                cutoffScale = 0.9
                steepPower = 7
                steepContrast = 4
                steepMidpoint = 0.72
                maxNormalDeviance = 0.4
                minAltitude = 20
                maxAltitude = 900
                altitudeFadeRange = 60
                alignToTerrainNormal = False
                coloredByTerrain = False

                LODs
                {
                    LOD
                    {
                        model = SaveRhode/Models/LuaSapling/saplingTrunkLOD1
                        range = 110
                        Material
                        {
                            shader = Custom/ParallaxInstancedSolid
                            _MainTex = SaveRhode/Textures/LuaSapling/saplingBark.dds
                            _BumpMap = SaveRhode/Textures/LuaSapling/saplingBarknrm.dds
                            _SpecularPower = 12
                            _SpecularIntensity = 0.02
                            _FresnelPower = 3
                            _EnvironmentMapFactor = 1
                            _BumpScale = 1
                            _Hapke = 1
                            _FresnelColor = 0.05,0.05,0.05,1
                            _Color = 1,1,1,1
                            _CullMode = 2
                            Keywords
                            {
                            }
                        }
                    }

                    LOD
                    {
                        model = SaveRhode/Models/LuaSapling/saplingTrunkLOD2
                        range = 1400
                        Material
                        {
                            shader = Custom/ParallaxInstancedSolid
                            _MainTex = SaveRhode/Textures/LuaSapling/saplingBillboard.dds
                            _BumpMap = SaveRhode/Textures/LuaSapling/saplingBillboardnrm.dds
                            _SpecularPower = 12
                            _SpecularIntensity = 0.015
                            _FresnelPower = 3
                            _EnvironmentMapFactor = 1
                            _BumpScale = 1
                            _Hapke = 1
                            _Cutoff = 0.35
                            _FresnelColor = 0.05,0.05,0.05,1
                            _Color = 0.85,0.88,0.78,1
                            _CullMode = 2
                            Keywords
                            {
                                name = ALPHA_CUTOFF
                                name = BILLBOARD
                            }
                        }
                    }
                }

                // Lua 的极地高地不适合树苗（沿用 BeyondHome 的高地设定名；
                // 若实际 biome 名不同，Parallax 会直接忽略，不会报错）
                BiomeBlacklist
                {
                    name = Polar Highlands
                }
            }
        }

        // -----------------------------------------------------------------
        //  树冠（跟随树干的共享散点，双面裁剪叶簇）
        // -----------------------------------------------------------------
        SharedScatter
        {
            name = LuaSaplingCanopy
            model = SaveRhode/Models/LuaSapling/saplingCanopyLOD0
            collisionLevel = 0
            parentName = LuaSapling

            Optimizations
            {
                frustumCullingStartRange = 0
                frustumCullingScreenMargin = -400
                maxRenderableObjectsLOD0 = 300
                maxRenderableObjectsLOD1 = 1500
                maxRenderableObjectsLOD2 = 15000
            }

            Material
            {
                shader = Custom/ParallaxInstancedSolid
                _MainTex = SaveRhode/Textures/LuaSapling/saplingLeaves.dds
                _BumpMap = SaveRhode/Textures/LuaSapling/saplingLeavesnrm.dds
                _WindMap = Parallax_StockScatterTextures/PluginData/grassuv2.dds
                _SpecularPower = 15
                _SpecularIntensity = 0.05
                _FresnelPower = 3
                _EnvironmentMapFactor = 1
                _BumpScale = 1
                _Hapke = 1
                _Cutoff = 0.32
                _WindScale = 0.006
                _WindHeightStart = 0.45
                _WindHeightFactor = 0.7
                _WindSpeed = 0.85
                _WindIntensity = 0.18
                _FresnelColor = 0.05,0.05,0.05,1
                _Color = 0.95,1,0.9,1
                _CullMode = 0
                Keywords
                {
                    name = ALPHA_CUTOFF
                    name = TWO_SIDED
                    name = WIND
                }
            }

            Distribution
            {
                LODs
                {
                    LOD
                    {
                        model = SaveRhode/Models/LuaSapling/saplingCanopyLOD1
                        range = 0
                        MaterialOverride
                        {
                        }
                    }
                }
            }
        }
    }
}

// ---------------------------------------------------------------------
// 可选：如果 BeyondHome 自带的 Lua 树散点与本配置重名/重复，
