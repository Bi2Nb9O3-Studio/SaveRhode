        // Source: Configs\Anger.cfg | Node: Kopernicus/Body:HAS[#name[Anger]]/Properties | Field: description
        #autoLOC_BeyondHome_CB0F2BD9 = "[Kopernicus/Body:HAS[#name[Anger]]/Properties] [#autoLOC_BeyondHome_CB0F2BD9] Anger is believed to have formed through a massive collision with its parent planet, resulting in the partial destruction of Fury. Due to its proximity to the stars, Anger glows a subtle red colour when being shone on by Fate. We do not consider Anger to be hazardous, but we advise any future expeditions to this world to be careful."

