        #autoLOC_BeyondHome_2C6A3A73 = "[Kopernicus/Body:HAS[#name[Ansia]]/Properties] [#autoLOC_BeyondHome_2C6A3A73] Ansia^N"

        // Source: Configs\Ansia.cfg | Node: Kopernicus/Body:HAS[#name[Ansia]]/Properties | Field: description
        #autoLOC_BeyondHome_1682304D = "[Kopernicus/Body:HAS[#name[Ansia]]/Properties] [#autoLOC_BeyondHome_1682304D] Nobody is quite sure how Ansia's mountainous ridges formed. Its structure and colour is unlike any other in the Tempus system and Ansia still baffles experts to this day. <color=#32B0FF>Science bonuses will be awarded for returning data from Ansia's peaks.</color>"

        // Source: Configs\Armstrong.cfg | Node: Kopernicus/Body:HAS[#name[Armstrong]]/Properties | Field: displayName
        #autoLOC_BeyondHome_66C5E7E2 = "[Kopernicus/Body:HAS[#name[Armstrong]]/Properties] [#autoLOC_BeyondHome_66C5E7E2] Armstrong^N"

        // Source: Configs\Armstrong.cfg | Node: Kopernicus/Body:HAS[#name[Armstrong]]/Properties | Field: description
        #autoLOC_BeyondHome_0369C038 = "[Kopernicus/Body:HAS[#name[Armstrong]]/Properties] [#autoLOC_BeyondHome_0369C038] Armstrong is the smallest tracked body in the Tempus system. We're lucky enough to have it as a moon as it offers rich ore deposits for future missions beyond Rhode. There have been no plans for a base here yet."

        // Source: Configs\Ash.cfg | Node: Kopernicus/Body:HAS[#name[Ash]]/Properties | Field: displayName
        #autoLOC_BeyondHome_3B7D2A95 = "[Kopernicus/Body:HAS[#name[Ash]]/Properties] [#autoLOC_BeyondHome_3B7D2A95] Ash^N"

        // Source: Configs\Ash.cfg | Node: Kopernicus/Body:HAS[#name[Ash]]/Properties | Field: description
        #autoLOC_BeyondHome_D726FBC6 = "[Kopernicus/Body:HAS[#name[Ash]]/Properties] [#autoLOC_BeyondHome_D726FBC6] <color=#FF6A00>[THERMAL HAZARD]</color> Ash is a very molten world and it is relatively new to this system. We believe it was formed from an ancient asteroid belt and captured by Rhode. Its lava is cooling, but still far too dangerous to land near. The larger-than-average moon also has large ridges, forcing any landing site nearer to the lava. <color=#32B0FF>Science bonuses will be awarded for gathering science around the hot regions of this world.</color>"

        // Source: Configs\Destiny.cfg | Node: Kopernicus/Body[Sun]/Body:HAS[#name[Destiny]]/Properties | Field: displayName
        #autoLOC_BeyondHome_6DFE8A3E = "[Kopernicus/Body[Sun]/Body:HAS[#name[Destiny]]/Properties] [#autoLOC_BeyondHome_6DFE8A3E] Destiny"

        // Source: Configs\Destiny.cfg | Node: Kopernicus/Body[Sun]/Body:HAS[#name[Destiny]]/Properties | Field: description
        #autoLOC_BeyondHome_3A805BB1 = "[Kopernicus/Body[Sun]/Body:HAS[#name[Destiny]]/Properties] [#autoLOC_BeyondHome_3A805BB1] Destiny is the primary star of the Tempus system. It glows whiter than Kerbol ever did and has billions of years left of its lifespan. Its luminosity is due to increase by 10% over the course of its main sequence life, which is abnormally low for a star of this size, making it a strong candidate for supporting a very stable system."

        // Source: Configs\Destiny.cfg | Node: Kopernicus/Body[Sun]/Body/Properties | Field: description
        #autoLOC_BeyondHome_4E633052 = "[Kopernicus/Body[Sun]/Body/Properties] [#autoLOC_BeyondHome_4E633052] Destiny is the primary star of the Tempus system. It glows whiter than Kerbol ever did and has billions of years left of its lifespan. Its luminosity is due to increase by 10% over the course of its main sequence life, which is abnormally low for a star of this size, making it a strong candidate for supporting a very stable system."

        // Source: Configs\Destiny.cfg | Node: Kopernicus/Body[Sun]/Body/Properties | Field: displayName
        #autoLOC_BeyondHome_26257535 = "[Kopernicus/Body[Sun]/Body/Properties] [#autoLOC_BeyondHome_26257535] Destiny"

        // Source: Configs\Drohze.cfg | Node: Kopernicus/Body:HAS[#name[Drohze]]/Properties | Field: displayName
        #autoLOC_BeyondHome_DF55F756 = "[Kopernicus/Body:HAS[#name[Drohze]]/Properties] [#autoLOC_BeyondHome_DF55F756] Drohze^N"

        // Source: Configs\Drohze.cfg | Node: Kopernicus/Body:HAS[#name[Drohze]]/Properties | Field: description
        #autoLOC_BeyondHome_5BF6995F = "[Kopernicus/Body:HAS[#name[Drohze]]/Properties] [#autoLOC_BeyondHome_5BF6995F] Drohze lived its life floating alone in the black. It was generally forgotten by all of civilisation, yet still resided far enough outside of Kerbol's blast zone to survive. Some time during the escape of this system, a large asteroid impacted the surface of this dwarf planet, appearing to have merged with it but still leaving a huge crater behind. <color=#32B0FF>Science bonuses will be awarded for gathering science from the gorges.</color>"

        // Source: Configs\Dynasty.cfg | Node: Kopernicus/Body:HAS[#name[Dynasty]]/Properties | Field: displayName
        #autoLOC_BeyondHome_50945A33 = "[Kopernicus/Body:HAS[#name[Dynasty]]/Properties] [#autoLOC_BeyondHome_50945A33] Dynasty^N"

        // Source: Configs\Dynasty.cfg | Node: Kopernicus/Body:HAS[#name[Dynasty]]/Properties | Field: description
        #autoLOC_BeyondHome_87919A5A = "[Kopernicus/Body:HAS[#name[Dynasty]]/Properties] [#autoLOC_BeyondHome_87919A5A] Dynasty is a remnant of the final home world of the Kerbol system. Its atmosphere burned and its oceans evaporated. No life remains on this planet. It now remains as a mere shadow of what it once was and continues to forge on alone, cold and empty just as it was found. <color=#FF6A00>On the 8th billionth year, the last colony ship bound for the Tempus system - Colony ship #36, 'Timeless' - was dispatched from the last launchpad located on the far side of the planet. Shortly after, it was deemed uninhabitable to all life and to never be returned to under any circumstance. No structures remain.</color>"

        // Source: Configs\Eidos.cfg | Node: Kopernicus/Body:HAS[#name[Eidos]]/Properties | Field: displayName
        #autoLOC_BeyondHome_AE5F50AF = "[Kopernicus/Body:HAS[#name[Eidos]]/Properties] [#autoLOC_BeyondHome_AE5F50AF] Eidos^N"

        // Source: Configs\Eidos.cfg | Node: Kopernicus/Body:HAS[#name[Eidos]]/Properties | Field: description
        #autoLOC_BeyondHome_BE5C9776 = "[Kopernicus/Body:HAS[#name[Eidos]]/Properties] [#autoLOC_BeyondHome_BE5C9776] Eidos is an incredibly icy world that resides far out of Gateway's reach. It is a pristine world, untouched by even asteroids. It is believed that this ice is frozen water, but a probe would need to be sent to validate that claim. Eidos gets its name from 'Eye' and 'Dos' because the first person to spot this world was drunk and saw two moons at the same time."

        // Source: Configs\Eterna.cfg | Node: Kopernicus/Body:HAS[#name[Eterna]]/Properties | Field: displayName
        #autoLOC_BeyondHome_C26739B9 = "[Kopernicus/Body:HAS[#name[Eterna]]/Properties] [#autoLOC_BeyondHome_C26739B9] Eterna^N"

        // Source: Configs\Eterna.cfg | Node: Kopernicus/Body:HAS[#name[Eterna]]/Properties | Field: description
        #autoLOC_BeyondHome_877A503F = "[Kopernicus/Body:HAS[#name[Eterna]]/Properties] [#autoLOC_BeyondHome_877A503F] Eterna is an icy world with minimal water. The water is said to be freezing over time, but heat from the death of Kerbol and mild tidal forces from other moons around Janus have slowed this cooling process. It's likely that with all this ice, Eterna's surface is very hazardous to land on."

        // Source: Configs\Fate.cfg | Node: Kopernicus/Body:HAS[#name[Fate]]/Properties | Field: displayName
        #autoLOC_BeyondHome_BAB20563 = "[Kopernicus/Body:HAS[#name[Fate]]/Properties] [#autoLOC_BeyondHome_BAB20563] Fate"

        // Source: Configs\Fate.cfg | Node: Kopernicus/Body:HAS[#name[Fate]]/Properties | Field: description
        #autoLOC_BeyondHome_6608005D = "[Kopernicus/Body:HAS[#name[Fate]]/Properties] [#autoLOC_BeyondHome_6608005D] Fate is the sister star to Destiny. It orbits the Tempus System Barycenter in a binary configuration. Its thermal output is low compared to Destiny but it makes up 25% of the light coming from this region of space. It is rumoured that Fate is a stabiliser for Destiny. Due to the stars' close proximity, Fate's mass is projected to decrease more per millenia than the average red dwarf star and this suggests that Destiny will use Fate as a fuel source over billions of years to prolong its lifespan. For now, we can enjoy the two pretty lights in the night sky."

        // Source: Configs\Fury.cfg | Node: Kopernicus/Body:HAS[#name[Fury]]/Properties | Field: displayName
        #autoLOC_BeyondHome_A6E425FE = "[Kopernicus/Body:HAS[#name[Fury]]/Properties] [#autoLOC_BeyondHome_A6E425FE] Fury^N"

        // Source: Configs\Fury.cfg | Node: Kopernicus/Body:HAS[#name[Fury]]/Properties | Field: description
        #autoLOC_BeyondHome_D600FA8D = "[Kopernicus/Body:HAS[#name[Fury]]/Properties] [#autoLOC_BeyondHome_D600FA8D] <color=#FF6A00>[THERMAL HAZARD]</color> Fury is the innermost planet. It is incredibly heavy and has a very thick atmosphere. Lava has been detected on its surface, making it completely inhospitable for any form of life. It's likely that Fury formed from an impact with its moon and has not cooled down due to its proximity to the two stars. <color=#32B0FF>Science bonuses will be extreme for returning data from Fury's lava lakes.</color>"

        // Source: Configs\Gateway.cfg | Node: Kopernicus/Body:HAS[#name[Gateway]]/Properties | Field: displayName
        #autoLOC_BeyondHome_D7AD85CC = "[Kopernicus/Body:HAS[#name[Gateway]]/Properties] [#autoLOC_BeyondHome_D7AD85CC] Gateway^N"

        // Source: Configs\Gateway.cfg | Node: Kopernicus/Body:HAS[#name[Gateway]]/Properties | Field: description
        #autoLOC_BeyondHome_D3D81B15 = "[Kopernicus/Body:HAS[#name[Gateway]]/Properties] [#autoLOC_BeyondHome_D3D81B15] We call this Gateway because it leads the way to the outer reaches of the Tempus system. It is a massive gas giant home to extremely varied moons. It has a 100% cloud coverage and any attempts to see further down into the core have failed. It exerts extreme tidal forces on the nearby planets, especially Kohm, resulting in huge temperature differences. Caution is advised as there is a possibility of volcanic or geyser activity. Our readings suggest that there is a 20km deep canyon range all across this planet."

        // Source: Configs\Hydron.cfg | Node: Kopernicus/Body:HAS[#name[Hydron]]/Properties | Field: displayName
        #autoLOC_BeyondHome_EBE65B2D = "[Kopernicus/Body:HAS[#name[Hydron]]/Properties] [#autoLOC_BeyondHome_EBE65B2D] Hydron^N"

        // Source: Configs\Hydron.cfg | Node: Kopernicus/Body:HAS[#name[Hydron]]/Properties | Field: description
        #autoLOC_BeyondHome_1BD4512A = "[Kopernicus/Body:HAS[#name[Hydron]]/Properties] [#autoLOC_BeyondHome_1BD4512A] Hydron was involved in the creation of its parent planet, Hydrus. It's likely that this violent collision between the two is what formed Hydrus' incredibly thick atmosphere. Hydron's main surface colour absorbs 96% of all light that hits it, making it darker than the surrounding nebulae. <color=#32B0FF>Science bonuses will be awarded for landing in the canyons of Hydron.</color>"

        // Source: Configs\Hydrus.cfg | Node: Kopernicus/Body:HAS[#name[Hydrus]]/Properties | Field: displayName
        #autoLOC_BeyondHome_B248040C = "[Kopernicus/Body:HAS[#name[Hydrus]]/Properties] [#autoLOC_BeyondHome_B248040C] Hydrus^N"

        // Source: Configs\Hydrus.cfg | Node: Kopernicus/Body:HAS[#name[Hydrus]]/Properties | Field: description
        #autoLOC_BeyondHome_83646082 = "[Kopernicus/Body:HAS[#name[Hydrus]]/Properties] [#autoLOC_BeyondHome_83646082] <color=#C9F1FF>[MAGNETIC ANOMALY | PRESSURE WARNING]</color> Smothered in cloud, Hydrus resides closer to the binary stars than Rhode. Its atmosphere is thicker than ours and so a pressure warning has been issued for this world. Its core is under <color=#FF752B>heavy magnetic strain</color>. Metallic material has clumped together in its atmosphere and it is believed these are solid objects. EXTREME CAUTION is advised when entering Hydrus' atmosphere. <color=#32B0FF>Science bonuses will be awarded for returning science from Hydrus' peaks and poles.</color>"

        // Source: Configs\Jade.cfg | Node: Kopernicus/Body:HAS[#name[Jade]]/Properties | Field: displayName
        #autoLOC_BeyondHome_C602B541 = "[Kopernicus/Body:HAS[#name[Jade]]/Properties] [#autoLOC_BeyondHome_C602B541] Jade^N"

        // Source: Configs\Jade.cfg | Node: Kopernicus/Body:HAS[#name[Jade]]/Properties | Field: description
        #autoLOC_BeyondHome_103FBFD1 = "[Kopernicus/Body:HAS[#name[Jade]]/Properties] [#autoLOC_BeyondHome_103FBFD1] This world is a mix of crystal, ice and rock. We're not actually sure how this was formed, but it pleases the eye like a gem. The crystal in the surface of this moon reflects a large portion of the light that hits it, making it slightly shiny."

        // Source: Configs\Janus.cfg | Node: Kopernicus/Body:HAS[#name[Janus]]/Properties | Field: displayName
        #autoLOC_BeyondHome_C7C9D061 = "[Kopernicus/Body:HAS[#name[Janus]]/Properties] [#autoLOC_BeyondHome_C7C9D061] Janus^N"

        // Source: Configs\Janus.cfg | Node: Kopernicus/Body:HAS[#name[Janus]]/Properties | Field: description
        #autoLOC_BeyondHome_22BD57C6 = "[Kopernicus/Body:HAS[#name[Janus]]/Properties] [#autoLOC_BeyondHome_22BD57C6] Janus is the remnants of a vast gas giant. Its atmosphere has decreased by more than 80% over the last few billion years. Records from when this system was previously inhabited show that the mass of this planet has also fallen significantly, indicating that a huge portion of its atmosphere was lost. <color=#FF752B>Floating islands have been detected on Janus' lowlands.</color> <color=#32B0FF>Science bonuses will be extreme from the surface of this planet.</color>"

        // Source: Configs\Kerbol.cfg | Node: Kopernicus/Body:HAS[#name[Kerbol]]/Properties | Field: displayName
        #autoLOC_BeyondHome_E55FB023 = "[Kopernicus/Body:HAS[#name[Kerbol]]/Properties] [#autoLOC_BeyondHome_E55FB023] Kerbol"

        // Source: Configs\Kerbol.cfg | Node: Kopernicus/Body:HAS[#name[Kerbol]]/Properties | Field: description
        #autoLOC_BeyondHome_7E67793E = "[Kopernicus/Body:HAS[#name[Kerbol]]/Properties] [#autoLOC_BeyondHome_7E67793E] Kerbol died on the 9th billionth year. Its thermal output from the initial explosion was over seven times the scale it was predicted. A sudden burst of heat impacted many of the innermost planets, scorching their surfaces. After a firey end, this no-longer-main-sequence star is all that remains of the heart of the Kerbol system. It now resides as a cooling white dwarf star with the most spectacular views, but returning here is no longer an option for survival. The only way forward is beyond home."

        // Source: Configs\Kohm.cfg | Node: Kopernicus/Body:HAS[#name[Kohm]]/Properties | Field: displayName
        #autoLOC_BeyondHome_2F7E9E44 = "[Kopernicus/Body:HAS[#name[Kohm]]/Properties] [#autoLOC_BeyondHome_2F7E9E44] Kohm^N"

        // Source: Configs\Kohm.cfg | Node: Kopernicus/Body:HAS[#name[Kohm]]/Properties | Field: description
        #autoLOC_BeyondHome_DA93A9E3 = "[Kopernicus/Body:HAS[#name[Kohm]]/Properties] [#autoLOC_BeyondHome_DA93A9E3] Due to tidal forces exerted on Kohm by Gateway, temperatures vary hugely across this moon. It is believed that these extreme temperature differences cause a massive band of cloud to perpetually circle the planet. Not much of the surface is visible from space, so we know little about this world."

        // Source: Configs\Lond.cfg | Node: Kopernicus/Body:HAS[#name[Lond]]/Properties | Field: displayName
        #autoLOC_BeyondHome_0DD3C53B = "[Kopernicus/Body:HAS[#name[Lond]]/Properties] [#autoLOC_BeyondHome_0DD3C53B] Lond^N"

        // Source: Configs\Lond.cfg | Node: Kopernicus/Body:HAS[#name[Lond]]/Properties | Field: description
        #autoLOC_BeyondHome_534B1788 = "[Kopernicus/Body:HAS[#name[Lond]]/Properties] [#autoLOC_BeyondHome_534B1788] Lond is a dimly coloured moon that resides around Janus. It is one of the oldest objects in the Kerbol system, only now being recognised. It was once a colourful moon but it has become corrupted over time, making it a more muddy colour."

        // Source: Configs\Lua.cfg | Node: Kopernicus/Body:HAS[#name[Lua]]/Properties | Field: displayName
        #autoLOC_BeyondHome_7986813A = "[Kopernicus/Body:HAS[#name[Lua]]/Properties] [#autoLOC_BeyondHome_7986813A] Lua^N"

        // Source: Configs\Lua.cfg | Node: Kopernicus/Body:HAS[#name[Lua]]/Properties | Field: description
        #autoLOC_BeyondHome_AC742FFE = "[Kopernicus/Body:HAS[#name[Lua]]/Properties] [#autoLOC_BeyondHome_AC742FFE] Lua, Rhode's second largest moon, is undergoing partial terraforming. Progress is around 30% complete and has been temporarily halted to due a lack of funding. At current, the atmosphere is far too thin to be breathable but there is a small space port on the surface. This space port can be reopened for 7,000,000. It is a hugely valuable asset. Lua's terraforming is due to resume in 5 years, but progress will be slow. <color=#32B0FF> Science bonuses will be awarded for gathering data from around the polar highlands of Lua.</color>"

        // Source: Configs\Proxim.cfg | Node: Kopernicus/Body:HAS[#name[Proxim]]/Properties | Field: displayName
        #autoLOC_BeyondHome_B57A8982 = "[Kopernicus/Body:HAS[#name[Proxim]]/Properties] [#autoLOC_BeyondHome_B57A8982] Proxim^N"

        // Source: Configs\Proxim.cfg | Node: Kopernicus/Body:HAS[#name[Proxim]]/Properties | Field: description
        #autoLOC_BeyondHome_67BA32A7 = "[Kopernicus/Body:HAS[#name[Proxim]]/Properties] [#autoLOC_BeyondHome_67BA32A7] Proxim is the closest moon to the gas giant. Elaborately named, this moon has huge canyons on its surface. It could have been caused by lava flowing prior to this system's discovery, but none can be seen through telescopes anymore."

        // Source: Configs\Rhode.cfg | Node: Kopernicus/Body:HAS[#name[Kerbin]]/Properties | Field: displayName
        #autoLOC_BeyondHome_F9B90C2B = "[Kopernicus/Body:HAS[#name[Kerbin]]/Properties] [#autoLOC_BeyondHome_F9B90C2B] Rhode^N"

        // Source: Configs\Rhode.cfg | Node: Kopernicus/Body:HAS[#name[Kerbin]]/Properties | Field: description
        #autoLOC_BeyondHome_03D84434 = "[Kopernicus/Body:HAS[#name[Kerbin]]/Properties] [#autoLOC_BeyondHome_03D84434] <color=#436BD8>Our new home.</color> Rhode is the only habitable planet discovered by the Riftwalker expedition, named after its primary colony vessel. All other ventures beyond home had failed. This is the last known harbour for life. The colonization of Rhode has been ongoing for hundreds of years and will not complete for a long time, but it is suitable for Kerbal life at its current state. As the Tempus system is very young, Rhode is likely to be habitable for billions of years to come."

        // Source: Configs\Rock.cfg | Node: Kopernicus/Body:HAS[#name[Rock]]/Properties | Field: displayName
        #autoLOC_BeyondHome_25CDC3B4 = "[Kopernicus/Body:HAS[#name[Rock]]/Properties] [#autoLOC_BeyondHome_25CDC3B4] Rock^N"

        // Source: Configs\Rock.cfg | Node: Kopernicus/Body:HAS[#name[Rock]]/Properties | Field: description
        #autoLOC_BeyondHome_2AB4B4F0 = "[Kopernicus/Body:HAS[#name[Rock]]/Properties] [#autoLOC_BeyondHome_2AB4B4F0] Barraged by craters and beaten by a collision with a small moon, Rock resides alone in the black. Its surface gravity is high but so is its resource content, so the trip would be worthwhile if it wasn't for the lack of breathable air and, oh, an atmosphere."

        // Source: Configs\Scaythe.cfg | Node: Kopernicus/Body:HAS[#name[Scaythe]]/Properties | Field: displayName
        #autoLOC_BeyondHome_5A7F0129 = "[Kopernicus/Body:HAS[#name[Scaythe]]/Properties] [#autoLOC_BeyondHome_5A7F0129] Scaythe^N"

        // Source: Configs\Scaythe.cfg | Node: Kopernicus/Body:HAS[#name[Scaythe]]/Properties | Field: description
        #autoLOC_BeyondHome_A5C7D366 = "[Kopernicus/Body:HAS[#name[Scaythe]]/Properties] [#autoLOC_BeyondHome_A5C7D366] Scaythe is a rocky vacuum world. It is the last planet before the gas giant 'Gateway'. Scaythe may have once had water on its surface since there are clear markings and canyons on its surface. Nobody is sure where it went. <color=#32B0FF>Science bonuses will be awarded for collecting data from Scaythe's peaks</color>"

        // Source: Configs\Scindo.cfg | Node: Kopernicus/Body:HAS[#name[Scindo]]/Properties | Field: displayName
        #autoLOC_BeyondHome_6486CE88 = "[Kopernicus/Body:HAS[#name[Scindo]]/Properties] [#autoLOC_BeyondHome_6486CE88] Scindo^N"

        // Source: Configs\Scindo.cfg | Node: Kopernicus/Body:HAS[#name[Scindo]]/Properties | Field: description
        #autoLOC_BeyondHome_8F35EE60 = "[Kopernicus/Body:HAS[#name[Scindo]]/Properties] [#autoLOC_BeyondHome_8F35EE60] Huge mineral deposits on the surface of this moon formed over millions of years due to the surface reacting with particles from the stars hitting it. This gives it a shimmery, colourful effect visible from orbit. It has been marked as a gem of this system and mining is prohibited by all major governments on Rhode. This doesn't stop everyone from selling the crystals back home, though."

        // Source: Configs\System Barycenter.cfg | Node: Kopernicus/Body:HAS[#name[Sun]]/Properties | Field: displayName
        #autoLOC_BeyondHome_C0EEEF71 = "[Kopernicus/Body:HAS[#name[Sun]]/Properties] [#autoLOC_BeyondHome_C0EEEF71] Tempus System Barycenter"

        // Source: Configs\System Barycenter.cfg | Node: Kopernicus/Body:HAS[#name[Sun]]/Properties | Field: description
        #autoLOC_BeyondHome_B60B8909 = "[Kopernicus/Body:HAS[#name[Sun]]/Properties] [#autoLOC_BeyondHome_B60B8909] This is the exact of mass between Destiny and Fate. It is the region in space that both stars orbit around. All of the other planets in the Tempus system orbit this point. A low orbit around this region of space is <color=#FF6A00>HIGHLY DANGEROUS</color>."

        // Source: Configs\Talon.cfg | Node: Kopernicus/Body:HAS[#name[Talon]]/Properties | Field: displayName
        #autoLOC_BeyondHome_64BA6DC8 = "[Kopernicus/Body:HAS[#name[Talon]]/Properties] [#autoLOC_BeyondHome_64BA6DC8] Talon^N"

        // Source: Configs\Talon.cfg | Node: Kopernicus/Body:HAS[#name[Talon]]/Properties | Field: description
        #autoLOC_BeyondHome_5DCC62F4 = "[Kopernicus/Body:HAS[#name[Talon]]/Properties] [#autoLOC_BeyondHome_5DCC62F4] Talon is a cold, bare rock that orbits the failed gas giant. Craters cover its surface - scars that remind travellers of its life over billions of years. This is the heaviest vacuum world in this system."

        // Source: Configs\Tau.cfg | Node: Kopernicus/Body:HAS[#name[Tau]]/Properties | Field: displayName
        #autoLOC_BeyondHome_FA154E47 = "[Kopernicus/Body:HAS[#name[Tau]]/Properties] [#autoLOC_BeyondHome_FA154E47] Tau^N"

        // Source: Configs\Tau.cfg | Node: Kopernicus/Body:HAS[#name[Tau]]/Properties | Field: description
        #autoLOC_BeyondHome_B1DF17D6 = "[Kopernicus/Body:HAS[#name[Tau]]/Properties] [#autoLOC_BeyondHome_B1DF17D6] Tau is close enough to Janus to be affected by extreme tidal forces. This generates the heat required to sustain Tau's atmosphere and oceans. It's likely that this process will continue indefinitely as Tau's orbit is stable. Upon leaving the Kerbol system when Kerbol died, seeds were scattered across this world in the hopes of leaving a memory of the past on its surface. Multicellular life has been detected on Tau's surface. <color=#32B0FF>Science bonuses will be awarded for collecting data from Tau's volcanoes.</color>"

        // Source: Configs\Tribute.cfg | Node: Kopernicus/Body:HAS[#name[Tribute]]/Properties | Field: displayName
        #autoLOC_BeyondHome_06860B66 = "[Kopernicus/Body:HAS[#name[Tribute]]/Properties] [#autoLOC_BeyondHome_06860B66] Tribute^N"

        // Source: Configs\Tribute.cfg | Node: Kopernicus/Body:HAS[#name[Tribute]]/Properties | Field: description
        #autoLOC_BeyondHome_FC419CFC = "[Kopernicus/Body:HAS[#name[Tribute]]/Properties] [#autoLOC_BeyondHome_FC419CFC] A tribute to our lost world. This was once a thriving world full of life but now it floats alone. Moonless, oceanless. Without air, without much substance. It is a timeless world which knows no more age, ravaged by the anger of a dying star, now preserved eternally as a cooling core of a planet once loved. <color=#FF6A00>The last ship to leave this planet was bound for Duna/Solitude/Dynasty on the 5th billionth year and was shortly thereafter deemed uninhabitable and to never be returned to under any circumstance.</color>"

        // Source: Configs\Vasto.cfg | Node: Kopernicus/Body:HAS[#name[Vasto]]/Properties | Field: displayName
        #autoLOC_BeyondHome_B970A926 = "[Kopernicus/Body:HAS[#name[Vasto]]/Properties] [#autoLOC_BeyondHome_B970A926] Vasto^N"

        // Source: Configs\Vasto.cfg | Node: Kopernicus/Body:HAS[#name[Vasto]]/Properties | Field: description
        #autoLOC_BeyondHome_C544B4E8 = "[Kopernicus/Body:HAS[#name[Vasto]]/Properties] [#autoLOC_BeyondHome_C544B4E8] Vasto is an icy world with rocky mountains. Its surface has a slight shine which we believe is caused by the frozen liquid on its surface. As there appear to be large mountains on this world, caution is advised when exploring it. <color=#32B0FF>Science bonuses will be awarded for returning data from Vasto's Main Impact Basin.</color>"

        // Source: Configs\Verna.cfg | Node: Kopernicus/Body:HAS[#name[Verna]]/Properties | Field: displayName
        #autoLOC_BeyondHome_42921DEA = "[Kopernicus/Body:HAS[#name[Verna]]/Properties] [#autoLOC_BeyondHome_42921DEA] Verna^N"

        // Source: Configs\Verna.cfg | Node: Kopernicus/Body:HAS[#name[Verna]]/Properties | Field: description
        #autoLOC_BeyondHome_5480523D = "[Kopernicus/Body:HAS[#name[Verna]]/Properties] [#autoLOC_BeyondHome_5480523D] Data records on this planet indicate that it was once a completely icy world residing at the far reaches of this system. There are clear indications of water on its surface. There is an outpost stationed here of a few hundred Kerbals - they are the last of this system and they are not a self sustaining colony."

        // Source: Configs\Voss.cfg | Node: Kopernicus/Body:HAS[#name[Voss]]/Properties | Field: displayName
        #autoLOC_BeyondHome_86EC516A = "[Kopernicus/Body:HAS[#name[Voss]]/Properties] [#autoLOC_BeyondHome_86EC516A] Voss^N"

        // Source: Configs\Voss.cfg | Node: Kopernicus/Body:HAS[#name[Voss]]/Properties | Field: description
        #autoLOC_BeyondHome_A9C8BF98 = "[Kopernicus/Body:HAS[#name[Voss]]/Properties] [#autoLOC_BeyondHome_A9C8BF98] Voss is a moon covered in gorges and canyons. It has a major canyon that stretches over as much as half of the moon - the largest canyon in this system. It is believed that these canyons were formed by fast moving lava during this moon's violent creation. <color=#32B0FF>Science bonuses will be awarded for returning science from Voss' main gorge.</color>"

        // Source: Configs\_NotScienceDefinitions.cfg | Node: EXPERIMENT_DEFINITION:HAS[#id[crewReport]]/RESULTS | Field: default
        #autoLOC_BeyondHome_C779F418 = "[EXPERIMENT_DEFINITION:HAS[#id[crewReport]]/RESULTS] [#autoLOC_BeyondHome_C779F418] Looks like you don't get a special sarcastic science report for this planet. Think yourself lucky, you might have cut yourself on that edge."

        // Source: Configs\_NotScienceDefinitions.cfg | Node: EXPERIMENT_DEFINITION:HAS[#id[crewReport]]/RESULTS | Field: KerbinSrfLandedLaunchPad
        #autoLOC_BeyondHome_14D1DA02 = "[EXPERIMENT_DEFINITION:HAS[#id[crewReport]]/RESULTS] [#autoLOC_BeyondHome_14D1DA02] Rhode, eh? Looks pretty desert-ed! Ha. There should be a portal device to your le- wait no, wrong script."

        // Source: Configs\_NotScienceDefinitions.cfg | Node: EXPERIMENT_DEFINITION:HAS[#id[crewReport]]/RESULTS | Field: KerbinSrfLandedRunway
        #autoLOC_BeyondHome_4C15257D = "[EXPERIMENT_DEFINITION:HAS[#id[crewReport]]/RESULTS] [#autoLOC_BeyondHome_4C15257D] Planes are cool and all, but are you gonna, yknow, SET OFF?"

        // Source: Configs\_NotScienceDefinitions.cfg | Node: EXPERIMENT_DEFINITION:HAS[#id[crewReport]]/RESULTS | Field: KerbinSrfLandedVAB
        #autoLOC_BeyondHome_41240F4D = "[EXPERIMENT_DEFINITION:HAS[#id[crewReport]]/RESULTS] [#autoLOC_BeyondHome_41240F4D] Of all the places to go, you chose to go here. Well isn't that just fantastic. Did you expect some special flavour text?"

        // Source: Configs\_NotScienceDefinitions.cfg | Node: EXPERIMENT_DEFINITION:HAS[#id[crewReport]]/RESULTS | Field: KerbinSrfLandedSPH
        #autoLOC_BeyondHome_2C3605FE = "[EXPERIMENT_DEFINITION:HAS[#id[crewReport]]/RESULTS] [#autoLOC_BeyondHome_2C3605FE] You could be out there furthering our knowledge of the stars and you decided to pitch up to the front door? Fine, have it your way."

